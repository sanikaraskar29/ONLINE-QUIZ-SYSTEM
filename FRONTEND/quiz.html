<!DOCTYPE html>
<html>
<head>
  <title>Online Quiz System</title>
</head>
<body>
  <h1>Add a Quiz</h1>
  <form id="quizForm">
    <label>Title:</label><br>
    <input type="text" id="title" required><br><br>

    <label>Description:</label><br>
    <input type="text" id="description" required><br><br>

    <label>Max Marks:</label><br>
    <input type="number" id="maxMarks" required><br><br>

    <label>Number of Questions:</label><br>
    <input type="number" id="numberOfQuestions" required><br><br>

    <button type="submit">Add Quiz</button>
  </form>

  <p id="message"></p>

  <script>
    const form = document.getElementById('quizForm');
    const message = document.getElementById('message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const quizData = {
        title: document.getElementById('title').value,
        description: document.getElementById('description').value,
        maxMarks: document.getElementById('maxMarks').value,
        numberOfQuestions: document.getElementById('numberOfQuestions').value
      };

      try {
        const response = await fetch('http://localhost:8080/api/quizzes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(quizData)
        });

        if (response.ok) {
          message.textContent = 'Quiz added successfully!';
          form.reset();
        } else {
          message.textContent = 'Error adding quiz.';
        }
      } catch (err) {
        message.textContent = 'Server error: ' + err;
      }
    });
  </script>
</body>
</html>
